<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tapestry — scripture, spoken</title>
  <meta name="description" content="A personal scripture collection and audio playback prototype." />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#8C3A1E" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tapestry" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    html,body{margin:0;padding:0;background:#EDEAE2;min-height:100%;}
    #root{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;}
    @media (min-width:480px){ #root{padding:32px 16px;} }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="./bundle.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
